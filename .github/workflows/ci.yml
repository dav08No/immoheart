name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run test
